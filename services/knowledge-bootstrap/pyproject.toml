[project]
name = "knowledge-bootstrap"
version = "0.1.0"
description = "Standalone source-backed reference knowledge service"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "defusedxml>=0.7.1,<1",
    "dnspython>=2.8,<3",
    "fastapi>=0.115,<1",
    "lxml>=6.1,<7",
    "markdown-it-py>=3,<5",
    "protego>=0.6.2,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.9,<3",
    "pypdf>=6.19,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
knowledge-bootstrap = "knowledge_bootstrap.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires KNOWLEDGE_TEST_DATABASE_URL pointing to a disposable Postgres database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
